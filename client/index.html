if(!matchMedia('(prefers-reduced-motion: reduce)').matches){app.addEventListener('pointermove',function(e){var el=e.target.closest('.stat,.fm-section');if(!el)return;var r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.setProperty('--tilt-x',(x*3)+'deg');el.style.setProperty('--tilt-y',(-y*3)+'deg');el.style.setProperty('--lift','-2px')});app.addEventListener('pointerout',function(e){var el=e.target.closest('.stat,.fm-section');if(el&&!el.contains(e.relatedTarget)){el.style.setProperty('--tilt-x','0deg');el.style.setProperty('--tilt-y','0deg');el.style.setProperty('--lift','0px')}})}
